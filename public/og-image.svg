<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>
  
  <!-- Gradient overlays -->
  <defs>
    <radialGradient id="glow1" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  
  <!-- Floating elements -->
  <circle cx="150" cy="150" r="3" fill="#9d4edd" opacity="0.6"/>
  <circle cx="1050" cy="480" r="4" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="200" cy="500" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="1000" cy="130" r="3" fill="#9d4edd" opacity="0.5"/>
  <circle cx="600" cy="100" r="2" fill="#c4b5fd" opacity="0.3"/>
  
  <!-- Border glow -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="url(#textGradient)" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Badge -->
  <rect x="475" y="160" width="250" height="40" rx="20" fill="rgba(167,139,250,0.1)" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="middle" letter-spacing="3">FRONTEND DEVELOPER</text>
  
  <!-- Name -->
  <text x="600" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Mykola Matekha</text>
  
  <!-- Subtitle -->
  <text x="600" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a8c5e2" text-anchor="middle" opacity="0.8">Building modern web experiences</text>
  
  <!-- Tech stack -->
  <g transform="translate(600, 440)">
    <rect x="-280" y="-20" width="80" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="-240" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c4b5fd" text-anchor="middle">React</text>
    
    <rect x="-180" y="-20" width="100" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="-130" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c4b5fd" text-anchor="middle">JavaScript</text>
    
    <rect x="-60" y="-20" width="80" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="-20" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c4b5fd" text-anchor="middle">Node.js</text>
    
    <rect x="40" y="-20" width="70" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="75" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c4b5fd" text-anchor="middle">CSS3</text>
    
    <rect x="130" y="-20" width="70" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="165" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c4b5fd" text-anchor="middle">Git</text>
    
    <rect x="220" y="-20" width="60" height="36" rx="18" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="250" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c4b5fd" text-anchor="middle">SQL</text>
  </g>
  
  <!-- Website URL -->
  <text x="600" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle" opacity="0.7">matehakola@gmail.com</text>
</svg>
